name: Build
on:
  push:
    branches-ignore:
      - 'automated*'
      - 'tutor*'
      - 'feedback*'
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  backend-builds:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: check if backend builds
        run: |
          cd api
          ./mvnw clean install -DskipTests=true
      - name: run backend tests
        run: |
          cd api
          ./mvnw test
  frontend-builds:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: npm clean install
        run: |
          cd frontend
          npm ci
      - name: run frontend tests
        run: |
          cd frontend
          npm run test
      - name: npm run build
        run: |
          cd frontend
          npm run build
