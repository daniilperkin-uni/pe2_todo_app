name: Build
on:
  push:
    branches-ignore:
      - 'automated*'
      - 'tutor*'
      - 'feedback*'
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  backend-builds:
    name: Build backend
    runs-on: self-hosted
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: check if backend builds
        run: |
          cd api
          ./mvnw clean install -DskipTests=true
  frontend-builds:
    name: Build frontend
    runs-on: self-hosted
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: npm clean install
        run: |
          cd frontend
          npm ci
      - name: npm run build
        run: |
          cd frontend
          npm run build
