events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 0.0.0.0:80;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }

        location /api {
            proxy_pass http://api:8080/api;
        }

        location /swagger-ui {
            proxy_pass http://api:8080/swagger-ui;
        }

        # The API port is not published by docker-compose, so the health probe
        # is only reachable through this proxy. Metrics stay inside the compose
        # network (api:8080) on purpose: a public deployment must not leak them.
        location = /actuator/health {
            proxy_pass http://api:8080/actuator/health;
        }
    }
}
