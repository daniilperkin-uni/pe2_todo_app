events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 0.0.0.0:80;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }

        location /api {
            proxy_pass http://api:8080/api;
        }

        location /swagger-ui {
            proxy_pass http://api:8080/swagger-ui;
        }
    }
}
