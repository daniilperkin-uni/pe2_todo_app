# specify log level
logging.level.web=DEBUG
# don't show exception stack traces in responses (comment out next line to see them for debugging)
server.error.include-stacktrace=never
# pretty-print JSON responses
spring.jackson.serialization.indent-output=true
# setting a custom URL for the OpenAPI resource
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.writer-with-default-pretty-printer=true
# settings for the database
# Credentials and URL are provided via environment variables; see .env.example
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/todoapp?createDatabaseIfNotExist=true&serverTimezone=UTC&useUnicode=yes&characterEncoding=UTF-8}
# MariaDB username and password
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# automatically update tables on entity changes (preserves data across restarts)
spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=health,prometheus
